="27" fill="white" stroke="#a2b7b6" rx="3"/><text x="490.0" y="790.0" text-anchor="middle" font-size="16" font-weight="bold">120ft</text><path d="M150 680L430 890" stroke="#517575" stroke-width="4" fill="none"/><rect x="221.0" y="770.0" width="68" height="27" fill="white" stroke="#a2b7b6" rx="3"/><text x="255.0" y="790.0" text-anchor="middle" font-size="16" font-weight="bold">180ft</text><path d="M150 680L150 480" stroke="#517575" stroke-width="4" fill="none"/><rect x="146.0" y="555.0" width="68" height="27" fill="white" stroke="#a2b7b6" rx="3"/><text x="180.0" y="575.0" text-anchor="middle" font-size="16" font-weight="bold">120ft</text><path d="M150 480L470 680" stroke="#517575" stroke-width="4" fill="none"/><rect x="246.0" y="575.0" width="68" height="27" fill="white" stroke="#a2b7b6" rx="3"/><text x="280.0" y="595.0" text-anchor="middle" font-size="16" font-weight="bold">160ft</text><rect x="330" y="109" width="200" height="62" rx="4" fill="#fff5f5" stroke="#963e32" stroke-width="2"/><text x="430" y="133" text-anchor="middle" font-size="15" font-weight="bold">VEI-01</text><text x="430" y="159" text-anchor="middle" font-size="17">北の船着場</text><rect x="330" y="299" width="200" height="62" rx="4" fill="#f4f7f6" stroke="#243637" stroke-width="2"/><text x="430" y="323" text-anchor="middle" font-size="15" font-weight="bold">VEI-02</text><text x="430" y="349" text-anchor="middle" font-size="17">分かれ道</text><rect x="580" y="359" width="200" height="62" rx="4" fill="#f4f7f6" stroke="#243637" stroke-width="2"/><text x="680" y="383" text-anchor="middle" font-size="15" font-weight="bold">VEI-03</text><text x="680" y="409" text-anchor="middle" font-size="17">灯守の家</text><rect x="630" y="499" width="200" height="62" rx="4" fill="#f4f7f6" stroke="#243637" stroke-width="2"/><text x="730" y="523" text-anchor="middle" font-size="15" font-weight="bold">VEI-04</text><text x="730" y="549" text-anchor="middle" font-size="17">旧貯蔵室</text><rect x="370" y="649" width="200" height="62" rx="4"