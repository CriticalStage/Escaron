<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200"><title>オルデン橋 戦術戦闘探索図</title><defs><pattern id="stone_floor" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#e8eceb" stroke="#c2cecb" stroke-width="1"/><path d="M0 20h40M20 0v20M20 20v20" stroke="#b4c2be" stroke-width="0.75" fill="none"/></pattern><pattern id="wood_floor" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#eedec8" stroke="#d6c3aa" stroke-width="1"/><path d="M0 10h40M0 20h40M0 30h40" stroke="#caa885" stroke-width="0.75" fill="none"/></pattern><pattern id="water" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#7ea5b0" stroke="#69939e" stroke-width="1"/><path d="M0 15Q10 10 20 15T40 15M0 30Q10 25 20 30T40 30" stroke="#527b87" stroke-width="1.5" fill="none"/></pattern><pattern id="web" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#f5f0e6" stroke="#dcd4c5" stroke-width="1"/><path d="M0 0L40 40M40 0L0 40M20 0L20 40M0 20L40 20" stroke="#b8aa94" stroke-width="0.8" stroke-dasharray="2 2" fill="none"/></pattern></defs><rect width="1200" height="1200" fill="#f4f6f5"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1b2a2b"><text x="50" y="45" font-size="28" font-weight="bold">オルデン橋：橋面および古代水門迷宮</text><text x="50" y="78" font-size="16" fill="#4a5f60">プレイヤー用：1マス＝5ft、水流・高低差・蜘蛛の巣（1マス＝5フィート）</text><g id="bridge_surface"><text x="50" y="120" font-size="18" font-weight="bold">【地上部】OLD-01 西岸詰所 〜 OLD-02 橋面（水面から20ft上）</text><rect x="260" y="135" width="680" height="130" fill="url(#water)" stroke="#527b87" stroke-width="2"/><text x="560" y="155" font-size="13" fill="#ffffff" font-weight="bold">急流レイン川（南へ激流・落下危険）</text><rect x="260" y="170" width="680" height="60" fill="url(#stone_floor)" stroke="#1b2a2b" stroke-width="5"/><rect x="80" y="160" width="180" height="80" fill="url(#wood_floor)" stroke="#1b2a2b" stroke-width="4"/><text x="100" y="205" font-size="15" font-weight="bold">OLD-01 西岸詰所</text><text x="100" y="225" font-size="12" fill="#616161">衛兵隊・商人荷車</text><rect x="780" y="170" width="160" height="60" fill="#d7ccc8" stroke="#b71c1c" stroke-width="3" stroke-dasharray="6 4"/><text x="800" y="205" font-size="14" fill="#b71c1c" font-weight="bold">沈下した木床（危険地形）</text><text x="800" y="222" font-size="11" fill="#b71c1c">※荷車の車輪落とし穴</text><rect x="280" y="175" width="40" height="50" fill="#455a64" stroke="#ffffff" stroke-width="2"/><text x="285" y="205" font-size="12" fill="#ffffff" font-weight="bold">点検口↓</text><text x="260" y="255" font-size="12" fill="#37474f">橋脚点検路へ（高低差17ft下る）</text></g><g id="pier_dungeon" transform="translate(50, 310)"><text x="0" y="-10" font-size="20" font-weight="bold">【橋脚地下】古代水門迷宮（水面より3ft上、天井12ft）</text><rect x="0" y="0" width="1100" height="720" fill="#37474f" rx="8"/><rect x="60" y="60" width="120" height="120" fill="url(#stone_floor)" stroke="#1b2a2b" stroke-width="4"/><text x="70" y="90" font-size="15" font-weight="bold">OLD-03 点検口</text><text x="70" y="110" font-size="11" fill="#546e7a">西岸からの階段口</text><rect x="180" y="90" width="140" height="60" fill="url(#stone_floor)" stroke="#1b2a2b" stroke-width="4"/><text x="210" y="125" font-size="12" fill="#546e7a">連絡通路</text><rect x="320" y="60" width="240" height="240" fill="url(#web)" stroke="#1b2a2b" stroke-width="5"/><text x="335" y="90" font-size="16" font-weight="bold" fill="#b71c1c">OLD-04 排水機関室</text><rect x="410" y="60" width="60" height="240" fill="url(#water)" stroke="#263238" stroke-width="2"/><text x="415" y="170" font-size="12" fill="#ffffff" font-weight="bold">排水溝（幅5ft・深さ4ft・濁流）</text><rect x="410" y="190" width="60" height="35" fill="#5d4037" stroke="#3e2723" stroke-width="2"/><text x="415" y="212" font-size="11" fill="#ffffff" font-weight="bold">詰まり瓦礫</text><text x="330" y="285" font-size="12" fill="#8d6e63">蜘蛛の巣密集（移動困難）</text><rect x="560" y="120" width="120" height="60" fill="url(#stone_floor)" stroke="#1b2a2b" stroke-width="4"/><rect x="680" y="80" width="240" height="160" fill="url(#stone_floor)" stroke="#1b2a2b" stroke-width="5"/><text x="695" y="110" font-size="16" font-weight="bold">OLD-05 技師リオの作業室</text><rect x="780" y="120" width="70" height="30" fill="#8d6e63" stroke="#4e342e" stroke-width="3" transform="rotate(15 815 135)"/><text x="775" y="180" font-size="13" fill="#d32f2f" font-weight="bold">倒壊した重架設棚</text><text x="695" y="225" font-size="12" fill="#37474f">東側格子（OLD-08 東岸作業浜へ通じる）</text><line x1="920" y1="130" x2="920" y2="190" stroke="#b0bec5" stroke-width="6" stroke-dasharray="6 4"/><rect x="380" y="300" width="120" height="100" fill="url(#stone_floor)" stroke="#1b2a2b" stroke-width="4"/><text x="400" y="350" font-size="12" fill="#546e7a">南連絡階段↓</text><rect x="100" y="400" width="320" height="260" fill="url(#water)" stroke="#1b2a2b" stroke-width="6"/><text x="115" y="430" font-size="16" font-weight="bold" fill="#ffffff">OLD-06 水没した古代水門室【新設】</text><text x="115" y="450" font-size="12" fill="#e0f7fa">水深3〜5ft（水位急上昇中！移動困難）</text><circle cx="260" cy="530" r="40" fill="#455a64" stroke="#cfd8dc" stroke-width="4"/><circle cx="260" cy="530" r="15" fill="#ff8f00"/><text x="215" y="590" font-size="13" fill="#ffffff" font-weight="bold">主水門解放歯車</text><text x="200" y="608" font-size="11" fill="#ffe082">（DC13筋力で水門開放可能）</text><rect x="100" y="400" width="70" height="260" fill="url(#stone_floor)" stroke="#37474f" stroke-width="2"/><text x="110" y="520" font-size="12" fill="#37474f">点検歩道</text><rect x="420" y="480" width="120" height="80" fill="url(#stone_floor)" stroke="#1b2a2b" stroke-width="4"/><rect x="540" y="380" width="400" height="290" fill="url(#web)" stroke="#1b2a2b" stroke-width="6"/><text x="560" y="410" font-size="18" font-weight="bold" fill="#b71c1c">OLD-07 巨母蜘蛛の巣窟【ボス決戦】</text><circle cx="840" cy="440" r="30" fill="#efebe9" stroke="#8d6e63" stroke-width="3" stroke-dasharray="4 2"/><text x="815" y="445" font-size="11" fill="#5d4037" font-weight="bold">蜘蛛の卵嚢</text><ellipse cx="880" cy="510" rx="20" ry="35" fill="#efebe9" stroke="#8d6e63" stroke-width="3"/><text x="865" y="515" font-size="11" fill="#5d4037" font-weight="bold">犠牲者の繭</text><rect x="860" y="600" width="55" height="35" fill="#ffd54f" stroke="#ff6f00" stroke-width="3"/><text x="865" y="622" font-size="12" fill="#e65100" font-weight="bold">帝国宝箱</text><text x="560" y="655" font-size="13" fill="#4e342e" font-weight="bold">床・天井全域に粘着蜘蛛糸（DC12敏捷力セーヴまたは移動力半減）</text><rect x="960" y="60" width="120" height="200" fill="url(#stone_floor)" stroke="#1b2a2b" stroke-width="4"/><text x="970" y="90" font-size="14" font-weight="bold">OLD-08 東岸作業浜</text><text x="970" y="110" font-size="11" fill="#546e7a">小舟・東岸斜面</text></g><g id="legend" transform="translate(50, 1060)"><rect x="0" y="0" width="1100" height="110" fill="#ffffff" stroke="#b0bec5" stroke-width="2" rx="6"/><text x="25" y="30" font-size="16" font-weight="bold">【戦術環境・ギミック】</text><text x="25" y="55" font-size="13" fill="#b71c1c">■ 水位上昇タイマー：18時に下層床へ浸水、20時には水深3ft（移動困難）。OLD-06の水門歯車を回せば水位を排出可能。</text><text x="25" y="78" font-size="13" fill="#37474f">■ 蜘蛛の巣：火に脆弱（松明で1マス燃焼可能、中にいるクリーチャーに1d6火ダメージ）。糸渡りを持たない者は移動困難地形。</text><text x="25" y="100" font-size="13" fill="#616161">■ 巨母蜘蛛アラクネラ：天井からの急降下奇襲、粘着網ブレス、幼生スウォーム召喚能力を持つCR2のボス。</text></g></g></svg>