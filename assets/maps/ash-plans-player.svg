<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200"><title>灰葦村 戦術戦闘探索図</title><defs><pattern id="stone_floor" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#e0e4e3" stroke="#b8c4c2" stroke-width="1"/><path d="M0 20h40M20 0v20M20 20v20" stroke="#a4b5b2" stroke-width="0.75" fill="none"/></pattern><pattern id="mud_floor" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#544738" stroke="#423629" stroke-width="1"/><path d="M5 15Q15 10 25 15T45 15M0 30Q10 25 20 30T40 30" stroke="#332a20" stroke-width="1.2" fill="none"/></pattern><pattern id="wood_floor" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#d7ccc8" stroke="#bcaaa4" stroke-width="1"/><path d="M0 10h40M0 20h40M0 30h40" stroke="#a1887f" stroke-width="0.75" fill="none"/></pattern></defs><rect width="1200" height="1200" fill="#f0f3f2"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#1b2a2b"><text x="50" y="45" font-size="28" font-weight="bold">灰葦村：廃屋群および水没教会・古代納骨堂</text><text x="50" y="78" font-size="16" fill="#4a5f60">プレイヤー用：1マス＝5ft、泥濘・遮蔽・石棺（1マス＝5フィート）</text><g id="morn_house"><text x="60" y="125" font-size="17" font-weight="bold">ASH-03 モーン家の廃屋（平屋・天井8ft）</text><rect x="60" y="140" width="240" height="160" fill="url(#wood_floor)" stroke="#1b2a2b" stroke-width="5"/><rect x="140" y="180" width="80" height="80" fill="url(#mud_floor)" stroke="#c62828" stroke-width="2" stroke-dasharray="4 2"/><text x="145" y="225" font-size="12" fill="#ffcdd2" font-weight="bold">腐食床（落とし穴）</text><rect x="140" y="140" width="50" height="25" fill="#5d4037" stroke="#3e2723" stroke-width="2"/><text x="145" y="158" font-size="12" fill="#ffffff" font-weight="bold">炉床</text><text x="60" y="325" font-size="12" fill="#546e7a">※炉床下に父の遺品箱（銀の留め具）</text></g><g id="guardpost"><text x="360" y="125" font-size="17" font-weight="bold">ASH-05 堤の監視所（半壊木柵）</text><rect x="360" y="140" width="160" height="160" fill="url(#wood_floor)" stroke="#1b2a2b" stroke-width="4"/><line x1="340" y1="310" x2="420" y2="310" stroke="#8d6e63" stroke-width="8"/><line x1="460" y1="310" x2="540" y2="310" stroke="#8d6e63" stroke-width="8"/><text x="360" y="335" font-size="12" fill="#8d6e63" font-weight="bold">防衛木柵（半遮蔽）</text><text x="360" y="355" font-size="11" fill="#c62828">※南30ftから射撃迎撃</text></g><g id="church"><text x="580" y="125" font-size="17" font-weight="bold">ASH-06 半壊した水没教会（天井15ft）</text><rect x="580" y="140" width="340" height="240" fill="url(#stone_floor)" stroke="#1b2a2b" stroke-width="6"/><rect x="620" y="180" width="260" height="160" fill="url(#mud_floor)" stroke="#3e2723" stroke-width="2"/><text x="680" y="240" font-size="13" fill="#ffe0b2" font-weight="bold">水没した礼拝席（移動困難）</text><rect x="850" y="220" width="60" height="80" fill="#37474f" stroke="#cfd8dc" stroke-width="3"/><circle cx="880" cy="260" r="14" fill="#9c27b0" stroke="#ffffff" stroke-width="2"/><text x="830" y="325" font-size="12" fill="#ba68c8" font-weight="bold">祭壇：夜番の留め金</text><rect x="850" y="150" width="50" height="40" fill="#212121" stroke="#ffeb3b" stroke-width="2" stroke-dasharray="4 2"/><text x="815" y="140" font-size="12" fill="#f57f17" font-weight="bold">隠し地下階段↓</text></g><g id="catacombs" transform="translate(60, 420)"><text x="0" y="-15" font-size="20" font-weight="bold" fill="#b71c1c">ASH-07 水没教会の地下納骨堂（カタコンベ）【新設ボス迷宮】</text><rect x="0" y="0" width="1080" height="620" fill="#263238" rx="8"/><rect x="60" y="60" width="160" height="160" fill="url(#stone_floor)" stroke="#1b2a2b" stroke-width="4"/><text x="75" y="95" font-size="15" font-weight="bold">納骨堂入口</text><text x="75" y="120" font-size="12" fill="#546e7a">教会祭壇からの階段↑</text><rect x="220" y="100" width="140" height="80" fill="url(#stone_floor)" stroke="#1b2a2b" stroke-width="4"/><text x="245" y="145" font-size="13" fill="#546e7a">冷気漂う回廊</text><rect x="360" y="40" width="260" height="260" fill="url(#stone_floor)" stroke="#1b2a2b" stroke-width="5"/><text x="375" y="70" font-size="16" font-weight="bold">石棺の間（村の歴代長老）</text><rect x="400" y="100" width="40" height="70" fill="#78909c" stroke="#37474f" stroke-width="2"/><text x="408" y="140" font-size="11" fill="#ffffff">石棺1</text><rect x="540" y="100" width="40" height="70" fill="#78909c" stroke="#37474f" stroke-width="2"/><text x="548" y="140" font-size="11" fill="#ffffff">石棺2</text><rect x="400" y="200" width="40" height="70" fill="#78909c" stroke="#37474f" stroke-width="2"/><text x="408" y="240" font-size="11" fill="#ffffff">石棺3</text><rect x="540" y="200" width="40" height="70" fill="#78909c" stroke="#37474f" stroke-width="2"/><text x="548" y="240" font-size="11" fill="#ffffff">石棺4</text><rect x="680" y="20" width="360" height="340" fill="url(#stone_floor)" stroke="#880e4f" stroke-width="6"/><text x="700" y="55" font-size="18" font-weight="bold" fill="#b71c1c">灰の騎士の霊廟【決戦場】</text><rect x="800" y="140" width="100" height="60" fill="#455a64" stroke="#d50000" stroke-width="3"/><text x="810" y="175" font-size="13" fill="#ffffff" font-weight="bold">騎士の主石棺</text><circle cx="730" cy="90" r="16" fill="#7b1fa2" stroke="#4a148c" stroke-width="2"/><circle cx="970" cy="90" r="16" fill="#7b1fa2" stroke="#4a148c" stroke-width="2"/><circle cx="730" cy="270" r="16" fill="#7b1fa2" stroke="#4a148c" stroke-width="2"/><circle cx="970" cy="270" r="16" fill="#7b1fa2" stroke="#4a148c" stroke-width="2"/><text x="740" y="325" font-size="12" fill="#ce93d8" font-weight="bold">死霊の篝火（冷気のオーラ：毎ラウンド1d4冷気）</text><rect x="980" y="190" width="45" height="30" fill="#ffd54f" stroke="#ff6f00" stroke-width="2"/><text x="982" y="210" font-size="11" fill="#e65100" font-weight="bold">遺宝箱</text><rect x="620" y="130" width="60" height="80" fill="url(#stone_floor)" stroke="#1b2a2b" stroke-width="4"/><rect x="220" y="360" width="600" height="220" fill="url(#mud_floor)" stroke="#1b2a2b" stroke-width="5"/><text x="240" y="395" font-size="16" font-weight="bold" fill="#ffcc80">水没した外郭納骨堂（泥水・深さ3ft）</text><text x="240" y="420" font-size="12" fill="#ffe0b2">※泥中から這い出るゾンビ群の伏兵エリア</text><rect x="440" y="300" width="80" height="60" fill="url(#mud_floor)" stroke="#1b2a2b" stroke-width="4"/></g><g id="legend" transform="translate(60, 1070)"><rect x="0" y="0" width="1080" height="100" fill="#ffffff" stroke="#b0bec5" stroke-width="2" rx="6"/><text x="25" y="28" font-size="15" font-weight="bold">【灰葦村・戦術環境】</text><text x="25" y="52" font-size="13" fill="#b71c1c">■ 泥濘水没地形：移動力半減。泥に潜む「沼泥ゾンビ」は掴みで水中に引きずり込み窒息を狙う。</text><text x="25" y="74" font-size="13" fill="#6a1b9a">■ 死霊の篝火：冷気のオーラ（半径10ft内の生者は毎ターン開始時に1d4［冷気］）。消火には1アクション＋水または布。</text><text x="25" y="94" font-size="13" fill="#37474f">■ サー・アルヴァー（ワイト）：冷気と生命吸収の剣（最大HP減少効果）、戦況に応じたスケルトン鼓舞。</text></g></g></svg>